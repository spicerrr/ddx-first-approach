name: Check station gestures
on:
  push:
    branches: [ddx-station-motion-check]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: first-set/demo
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: first-set/demo/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run test:e2e -- --project touch -g 'четыре станции'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: station-motion-screens
          path: first-set/demo/test-results/
          if-no-files-found: ignore
