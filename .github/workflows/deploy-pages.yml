name: Publish First Approach

on:
  push:
    branches: [main]
    paths:
      - first-set/demo/**
      - first-set/sa/contracts/scenario-v1.sample.json
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    defaults:
      run:
        working-directory: first-set/demo
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: first-set/demo/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Verify game rules
        run: npm test
      - name: Build the Pages artifact
        run: npm run build
      - name: Install Chromium for browser checks
        run: npx playwright install --with-deps --only-shell chromium
      - name: Run interaction and layout checks
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-checks
          path: first-set/demo/test-results/
          if-no-files-found: ignore
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: first-set/demo/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
