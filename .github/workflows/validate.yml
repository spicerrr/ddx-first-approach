name: Validate onboarding case

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install contract check dependencies
        run: python -m pip install PyYAML jsonschema openapi-spec-validator
      - name: Validate OpenAPI, event schema and links
        run: python first-set/sa/scripts/verify_docs.py
      - name: Parse browser demo JavaScript
        run: node --check first-set/demo/logic.js
      - name: Check interactive station transitions
        run: node --test first-set/demo/test-logic.mjs
