name: Validate onboarding case

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Install contract check dependencies
        run: python -m pip install jsonschema
      - name: Validate scenario, event schema and links
        run: python first-set/sa/scripts/verify_docs.py
      - name: Install demo dependencies
        run: npm ci --prefix first-set/demo
      - name: Verify game rules
        run: npm test --prefix first-set/demo
      - name: Verify types and production build
        run: npm run build --prefix first-set/demo
